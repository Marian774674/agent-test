spring:
  datasource:
    url: jdbc:mysql://192.168.100.128:3307/qq_assistant_test?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

langbot:
  base-url: http://localhost:5300

app:
  agent:
    token: test-token
  reminder:
    scan-interval-ms: 3600000
    batch-size: 50
  embedding:
    # 测试不加载真模型：索引任务的向量由测试里的 @Primary fake 提供。
    # 否则每个 Spring 上下文启动都会去加载 ONNX 模型并读写索引。
    enabled: false
    # 把索引定时任务推远：首次执行也推迟 1 小时，避免测试进行中往共享索引里追加数据
    index-interval-ms: 3600000
    index-initial-delay-ms: 3600000
  retrieval:
    # /api/ask 检索前同步补跑向量的上限；测试调小，断言请求内确实按配置值补跑。
    pre-run-index-limit: 3