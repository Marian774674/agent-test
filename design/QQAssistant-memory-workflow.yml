    - data:
        code: |
          import json


          def _load(text):
              raw = (text or "").strip()
              if raw.startswith("```"):
                  raw = raw.strip("`")
                  if raw.startswith("json"):
                      raw = raw[4:].lstrip()
              try:
                  data = json.loads(raw)
              except Exception:
                  return None
              return data if isinstance(data, dict) else None


          def _qq(value):
              """QQ 号统一成 int；读不出来返回 None。

              模型经常把号码写成字符串（"123"），按 isinstance(x, int) 判会整条丢掉。
              """
              if isinstance(value, bool):
                  return None
              if isinstance(value, int):
                  return value
              text = str(value if value is not None else "").strip()
              if not text:
                  return None
              try:
                  return int(text)
              except ValueError:
                  return None


          def main(text: str) -> dict:
              """把模型输出收成两个纯 JSON 数组；形状不对就当这一批什么都没抽到。"""
              data = _load(text)
              if data is None:
                  return {"contacts": "[]", "notes": "[]"}

              contacts = []
              for item in data.get("contacts") or []:
                  if not isinstance(item, dict):
                      continue
                  sender_id = _qq(item.get("sender_id"))
                  alias = str(item.get("alias") or "").strip()
                  if sender_id is None or not alias:
                      continue
                  contacts.append({
                      "sender_id": sender_id,
                      "alias": alias[:64],
                      "relation": str(item.get("relation") or "").strip()[:64],
                  })

              notes = []
              for item in data.get("notes") or []:
                  if not isinstance(item, dict):
                      continue
                  ids = item.get("source_msg_ids") or []
                  value = str(item.get("value") or "").strip()
                  predicate = str(item.get("predicate") or "").strip()
                  if not value or not predicate or not isinstance(ids, list) or not ids:
                      continue
                  # 缺省/null = 这是我自己的事；给了却读不成号码 = 指向不明，整条丢掉。
                  # 不能退化成 null —— 那会把别人的事实记到我头上。
                  raw_subject = item.get("subject_sender_id")
                  subject = None
                  if raw_subject is not None and str(raw_subject).strip():
                      subject = _qq(raw_subject)
                      if subject is None:
                          continue
                  notes.append({
                      "subject_sender_id": subject,
                      "predicate": predicate[:64],
                      "value": value[:255],
                      "happened_at": str(item.get("happened_at") or "").strip()[:32],
                      "source_msg_ids": ids,
                      "confidence": item.get("confidence"),
                  })

              return {"contacts": json.dumps(contacts, ensure_ascii=False),
                      "notes": json.dumps(notes, ensure_ascii=False)}
        code_language: python3
        desc: ''
        outputs:
          contacts:
