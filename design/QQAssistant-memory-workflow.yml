                  return {"answer": "", "used_ids": "[]"}
              if not isinstance(data, dict):
                  return {"answer": "", "used_ids": "[]"}
              answer = str(data.get("answer") or "").strip()
              used = data.get("used_ids")
              if not isinstance(used, list):
                  used = []
              used = [str(x).strip() for x in used if str(x).strip()][:5]
              if not used:
                  answer = ""
              return {"answer": answer[:512], "used_ids": json.dumps(used, ensure_ascii=False)}
