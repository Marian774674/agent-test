    - data:
        code: |
          import json


          def main(text: str) -> dict:
              """把模型输出收成一个纯 JSON 数组字符串；解析不了就返回空，绝不让脏数据流到 Spring。"""
              raw = (text or "").strip()
              if raw.startswith("```"):
                  raw = raw.strip("`")
                  if raw.startswith("json"):
                      raw = raw[4:].lstrip()
              try:
                  data = json.loads(raw)
              except Exception:
                  return {"items": "[]"}
              if isinstance(data, dict):
                  data = data.get("items")
              if not isinstance(data, list):
                  return {"items": "[]"}
              cleaned = []
              for item in data:
                  if not isinstance(item, dict):
                      continue
                  summary = str(item.get("summary") or "").strip()
                  ids = item.get("source_msg_ids") or []
                  if not summary or not isinstance(ids, list) or not ids:
                      continue
                  cleaned.append({
                      "summary": summary[:512],
                      "importance": item.get("importance"),
                      "keywords": item.get("keywords") or "",
                      "mentions_me": item.get("mentions_me") is True,
                      "source_msg_ids": ids,
                  })
              return {"items": json.dumps(cleaned, ensure_ascii=False)}
